<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>repo1 · Task Manager</title>
    <link rel="stylesheet" href="./styles.css" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✅</text></svg>" />
  </head>
  <body>
    <main class="app">
      <header class="app__header">
        <h1>Tasks</h1>
        <p class="app__subtitle">A tiny full-stack demo running on the Cloud Agent environment.</p>
      </header>

      <form id="new-task-form" class="composer" autocomplete="off">
        <input
          id="new-task-input"
          class="composer__input"
          type="text"
          name="title"
          placeholder="What needs doing?"
          aria-label="Task title"
          maxlength="200"
          required
        />
        <button class="composer__button" type="submit">Add</button>
      </form>

      <section class="stats" id="stats" aria-live="polite"></section>

      <ul id="task-list" class="task-list" aria-live="polite"></ul>

      <p id="empty-state" class="empty-state" hidden>Nothing here yet — add your first task above.</p>
    </main>

    <script src="./app.js" type="module"></script>
  </body>
</html>
